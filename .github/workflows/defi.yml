name: Défi quotidien

on:
  # Déclencheur principal : un cron externe (cron-job.org) appelle l'API de dispatch
  # à 10h30, parce que le planificateur de GitHub ne s'est jamais réveillé sur ce dépôt.
  workflow_dispatch:
    inputs:
      force:
        description: Envoyer même si le défi du jour est déjà parti
        type: boolean
        default: false

  # Gardés en filet : si GitHub finit par honorer ses crons, les gardes de post.js
  # empêchent tout doublon. Heures UTC ; le changement d'heure est absorbé par SEND_HOUR.
  schedule:
    - cron: '30 8 * * *' # 10h30 CEST (été)
    - cron: '30 9 * * *' # 10h30 CET (hiver)
    - cron: '30 12 * * *' # rattrapage

permissions:
  contents: write # pour recommiter data/state.json

concurrency: defi-quotidien # jamais deux envois en parallèle

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poster les défis
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ vars.ROLE_ID }}
          TIMEZONE: Europe/Paris
          SEND_HOUR: '10'
          # Seule la case cochée à la main force l'envoi : un appel API sans input
          # reste idempotent, donc un réessai du cron externe ne double pas le message.
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node src/post.js

      - name: Sauvegarder la progression
        run: |
          git config user.name "defi-bot"
          git config user.email "defi-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet && echo "Rien à sauvegarder." && exit 0
          git commit -m "défis du $(date -u +%F)"
          git push
